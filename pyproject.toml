[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am64x-secure-toolkit"
version = "2.0.0a33"
description = "AM64x/AM6442 Secure Boot Studio: guided GUI + CLI host-side security workflow toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Celil Aslan"}]
dependencies = [
  "cryptography>=41",
  "asn1crypto>=1.5",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
bundle = ["PyInstaller>=6.10,<7"]
gui = ["PySide6>=6.5,<7"]
all = ["PySide6>=6.5,<7", "PyInstaller>=6.10,<7"]

[project.scripts]
securectl = "am64x_secure_toolkit.cli:main"
securestudio = "am64x_secure_toolkit.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Correctness, import hygiene and modern-syntax rules are enforced.
select = ["E4", "E9", "F", "I", "UP", "RUF100"]
# Deliberately not enforced:
#   E7     - the GUI layer builds widgets with `w = QPushButton(...); w.clicked.connect(...)`
#            one-liners throughout. That is a consistent, intentional house style.
#   BLE001 - GUI action handlers catch broad exceptions on purpose and route every
#            failure through show_guided_error(), so the Studio reports errors
#            instead of dying on a background failure.
#   TRY004 - host-side checks report validation failures as results, not raises.
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["am64x_secure_toolkit"]
